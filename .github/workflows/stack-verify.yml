# Scientific-stack verification: the optional integrations, with and without
# their packages.
#
# PINNED BY COMMIT SHA: every `uses:` below is an immutable 40-hex commit
# object.
#
# SCOPE, so the green badge is not over-read: two legs. The `core` leg has
# none of the optional packages and must still pass, with every integration
# reporting UNAVAILABLE rather than substituting a result. The `full` leg
# installs usd-core, SALib and OpenMDAO and REQUIRES them: there a skipped
# path is a failure, so a disagreement cannot be passed by not computing it.
# Both legs run the generic scientific workflow -- the Snakefile's default
# target -- and assert the tracked tree is untouched. The target runs after
# every other step, the opt-in explorations included, and its last rule is
# the tree check, so the check sees what each of them did (AUD-036).
#
# What this proves: the VTK, OpenUSD, OpenMDAO and SALib integrations are
# deterministic, fail closed without their packages, and leave the tracked
# tree untouched. It proves nothing scientific: a representation or an
# exploration is not evidence.
name: stack-verify
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions: {}            # default-deny
jobs:
  stack-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read       # checkout only
    strategy:
      fail-fast: false
      matrix:
        extras: ["core", "full"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86   # v5
      - name: sync environment
        run: |
          if [ "${{ matrix.extras }}" = "full" ]; then
            uv sync --frozen --all-groups --extra viz --extra uq
          else
            uv sync --frozen --all-groups
          fi
      - name: the integration suites, and the generic sensitivity cross-check
        # the full leg REQUIRES its packages: there a skipped path is a
        # failure, so METHODS_DISAGREE cannot be passed by not computing it
        run: |
          if [ "${{ matrix.extras }}" = "full" ]; then
            export HARNESS_UQ_REQUIRED=1 HARNESS_VIZ_REQUIRED=1
          fi
          uv run python -m pytest tests/test_scientific_integrations.py \
            tests/test_sensitivity_cross_check.py \
            tests/test_harness_integrations.py -q
      - name: the opt-in explorations, where their packages are installed
        if: matrix.extras == 'full'
        run: |
          uv run snakemake --cores 1 uq_sobol
          uv run snakemake --cores 1 mdao_doe
      - name: the generic scientific workflow (the default target)
        # The last step that runs anything: the target's last rule checks
        # the tracked tree, and the step below reads that check's report, so
        # what a step after this one did to the tree would go unseen.
        run: uv run snakemake --cores 1
      - name: tracked tree untouched
        run: |
          uv run python - <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(
              Path("verification/stage10/tree_untouched.json").read_text())
          if report["mismatches"] or not report["detached_hash_ok"]:
              sys.exit(f"the workflow touched the tracked tree: {report}")
          print(f"tracked tree untouched ({report['entries']} entries)")
          PY
