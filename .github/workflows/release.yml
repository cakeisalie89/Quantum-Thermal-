# Least-privilege release workflow (Stage 9).
# STATUS: PENDING FIRST HOSTED RUN -- this sandbox has no Actions runner;
# nothing below has executed; no SLSA level is claimed.
# PIN-BY-DIGEST REQUIRED: replace every @vN tag with the action's full
# commit SHA before the first real run (policy #3).
name: qta-release
on:
  push:
    tags: ["qta-stage*"]
permissions: {}            # default-deny
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read       # checkout only
      id-token: write      # keyless Sigstore OIDC
    steps:
      - uses: actions/checkout@v4          # TODO pin by SHA
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@v5        # TODO pin by SHA
      - run: uv sync --frozen --all-groups
      - run: uv run python qta_full_sim.py
      - run: uv run python package_consistency_check.py
      - run: uv run python stage6_preservation_check.py
      - run: uv run python -m pytest tests/ -q
      - run: uv run python build_release_artifacts.py --ci
      - name: keyless sign (Sigstore)
        run: |
          uv run python -m pip install sigstore
          uv run python -m sigstore sign --bundle release/source.sigstore.json \
            release/QTA_source.zip
      - name: verify what we signed
        run: uv run python verify_release.py --zip release/QTA_source.zip \
              --bundle release/bundle --online
