# Claude Code Action — responds to @claude on issues, PRs, and reviews.
# STATUS: PENDING FIRST HOSTED RUN -- nothing below has executed. Two things
# are required before it can: the Claude GitHub App installed on this
# repository, and an ANTHROPIC_API_KEY repository secret. A workflow only
# takes effect once it is on the default branch.
# PINNED BY COMMIT SHA (RELEASE_POLICY.md #3), as for release.yml and
# stack-verify.yml. Every `uses:` below is an immutable 40-hex commit object;
# the trailing comment records which upstream tag that commit was at when it
# was pinned. Upstream is free to move those tags afterwards -- that is the
# point, and a moved tag is not by itself a reason to repin. Re-pin only for a
# stated reason (security advisory, action API change, required upstream fix),
# and resolve the new SHA from the upstream ref, peeling annotated tags.
#
# TRIGGER AUTHORISATION. This repository is public, so anyone can open an
# issue or comment. The gate is in the action, not in this file: it refuses to
# run for users without write access, and refuses bots entirely, unless
# `allowed_non_write_users` / `allowed_bots` are set. Neither is set here, and
# neither should be set without deciding, deliberately, that untrusted input
# may reach a job that holds ANTHROPIC_API_KEY.
#
# GOVERNANCE NOTE. This job holds `contents: write`, so Claude can push
# commits and open PRs here. That is the action's normal mode and is what
# makes it useful, but this repository's design is that no automated actor
# certifies its own work or moves authoritative scientific state except
# through the governed, event-sourced path -- and permissions do not enforce
# that; CI does. Any branch Claude pushes is still subject to the full test
# suite, the framework boundary (tools/framework_boundary.py), the mutation
# shards and the byte gate over committed outputs. The system prompt below
# states the rules; the checkers are what hold them.
#
# The prompt used to state the hardware-era invariants of the QTA package --
# a PASS count of zero, can_PASS_now=NO, forecast-only Mode B/D claim
# boundaries -- as if they were this repository's purpose. They were true of
# QTA and remain in its history; they are not the framework's invariants
# (directive 11), and a prompt that keeps teaching them keeps the migration
# from happening.
name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
permissions: {}            # default-deny; the job grants its own
# One run per issue/PR at a time: two @claude mentions racing each other can
# push to the same branch and interleave commits.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
jobs:
  claude:
    # WHO MAY INVOKE A CREDENTIALED AGENT, not merely who may say the word.
    #
    # This repository is PUBLIC. The condition below used to be the '@claude'
    # mention alone, so any GitHub account -- with no association to this
    # repository at all -- could start a job holding ANTHROPIC_API_KEY with
    # contents: write, pull-requests: write and issues: write, simply by
    # commenting on an issue.
    #
    # The checkout step already reasons carefully about the OTHER half of
    # this: it refuses to check out a fork PR's head at the workspace root
    # because that would run untrusted CODE beside the secret. Untrusted
    # INSTRUCTIONS reaching a credentialed agent is the same exposure through
    # the other door, and nothing here was closing it.
    #
    # author_association is computed by GitHub from the actor's relationship
    # to this repository and is not settable by the commenter. OWNER, MEMBER
    # and COLLABORATOR are the people who already have write access, so this
    # grants the agent to exactly those who could make the same change by
    # hand. Everyone else is ignored silently -- the job simply does not run.
    #
    # Fail-closed by construction: an association GitHub adds later, or one
    # this list does not name (CONTRIBUTOR, FIRST_TIME_CONTRIBUTOR, NONE),
    # does not match and the job does not start.
    #
    # The upstream action may well perform its own permission check. That is
    # a property of a third-party SHA, read from its own repository, and the
    # authorization of an agent that can push to this one should not rest on
    # a default nobody here has read. This is the same rule the rest of the
    # package applies to proxies.
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) && (
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                 github.event.comment.author_association ||
                 github.event.review.author_association ||
                 github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30      # bound a runaway loop's Actions and API spend
    permissions:
      contents: write        # push branches / commits
      pull-requests: write   # open PRs, comment
      issues: write          # comment on issues
      id-token: write        # OIDC
      actions: read          # read CI results on PRs
    steps:
      - name: Checkout repository
        # DO NOT add `ref:` here. This job can be triggered by a comment on a
        # pull request from a fork, and it holds secrets. Checking the PR head
        # out at the workspace root would run untrusted code with
        # ANTHROPIC_API_KEY in the environment -- the action's own security
        # guidance is explicit that the base branch belongs at the root, and
        # that a PR head belongs in a subdirectory passed via --add-dir.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803   # tag v6 at pin time
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@3f854a8fb5146b39d5cbf8b57f70d80810e1366f   # tag v1 at pin time (2026-08-20)
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # A project this concerned with provenance should not accept
          # unsigned automated commits: sign them so authorship is verifiable
          # the same way the repository's own commits are. This also removes
          # rebase/cherry-pick from Claude's reach, which is the behaviour we
          # want on a byte-gated tree.
          use_commit_signing: true
          claude_args: |
            --model claude-opus-5
            --system-prompt "This repository is a governed scientific-agent framework, migrating out of a hardware-era package called QTA. Hold these rules in every change you make or propose. AUTHORITY: authority is event-sourced -- state is what replay of the hash-chained log re-authorizes, and presence in the log is not authority. Proposal, execution and verification are separate principals; nothing verifies or promotes its own work, and an AI cannot self-certify. EVIDENCE: a simulation is not a measurement; numerical verification (an independent implementation agreeing) is not experimental validation; artifact integrity (the same bytes) is neither scientific verification nor authority. Never fabricate evidence, CI results, hardware data or a pass; report a failure as a failure. LEGACY: files dispositioned RETIRE_TO_HISTORY in FILE_DISPOSITION.csv are legacy QTA. Nothing in the active framework may import, open or take authority from them (tools/framework_boundary.py --check); they may be read to extract reusable physics. Do not delete a useful numerical or scientific method because its QTA wrapper is retired, and do not mass-delete hardware files before their unique equations are extracted and tested. BYTES: committed outputs are byte-gated by final_manifest.json; regenerate an output only with its producer and the manifest only with generate_manifest.py; never edit an output or a hash by hand, and never widen a tolerance to make a runner pass. PROCESS: do not merge, do not rewrite published history, do not force-push. Before pushing, run the test suite and tools/framework_boundary.py --check and report their results."
