# Agent authority substrate verification.
#
# STATUS: EXECUTED ON A HOSTED RUNNER. Actions runs 33905260267 (head 687c8a2)
# and 33909571694 (head a3515e7) both completed green. The previous "NOT YET
# EXECUTED ON A HOSTED RUNNER -- local evidence only" header is retired because
# it is no longer true; this is an evidence upgrade backed by those runs, not a
# widening of what the job checks.
#
# PINNED BY COMMIT SHA (RELEASE_POLICY.md #3): every `uses:` below is an
# immutable 40-hex commit object.
#
# SCOPE, so a green badge is not over-read: the agent-substrate job lints
# qta_agent/ and the tooling, runs every agent test suite plus the mutation
# harness's own suite, validates the completion matrix, runs the committed
# verifiers against the tree, and executes the governed Stage-10 rule.
#
# The mutation matrices themselves run in `mutation-shards` -- every
# specification, in deterministic shards generated by
# tools/mutation_shards.py -- and `mutation-matrices` is their aggregate: green
# only when every shard succeeded. The agent-substrate job keeps the lint, the
# verifiers, the agent suites and the governed run.
#
# Two further jobs run BESIDE it rather than after it:
#
#   full-suite          the complete pytest suite and package_consistency_check
#                       .py, which used to run only in release.yml. A failure
#                       confined to the scientific tests was therefore seen at
#                       release time rather than on the push that caused it.
#   second-interpreter  the agent suites on a DIFFERENT Python. The substrate
#                       and its tests need only pytest and hypothesis -- every
#                       other import is stdlib -- so this is possible without
#                       touching the scientific pin, which stays 3.12 because
#                       that is what the locked numeric stack resolves for.
#                       It tests the AUTHORITY LAYER on another interpreter,
#                       and claims nothing about the solvers.
#
# What this proves: the authority layer's enforcement points are load-bearing
# -- each one is deleted in turn and the suite must fail -- and the layer is
# structurally isolated from the scientific tree.
#
# What it proves scientifically: NOTHING. automatic_gate_effect = NONE. No
# module under qta_agent/ is imported by any solver, by qta_full_sim.py, or by
# metrics.py, and the isolation suite fails if that ever changes. The legacy
# QTA hardware-forecast gate table -- whose historical PASS_count is 0, a fact
# about that forecast and not a measure of this software -- is unaffected by
# every result in this workflow.
name: qta-agent-substrate
on:
  push:
    branches: ["**"]
    paths:
      - "qta_agent/**"
      - "tests/test_agent_*.py"
      - "tools/mutation_matrix.py"
      - "tools/mutation_shards.py"
      - "tools/verified_read_guard.py"
      - "tools/dependency_declarations.py"
      - "tools/mutations/**"
      - "tests/test_mutation_harness.py"
      - "docs/completion_matrix.json"
      - "tools/completion_matrix.py"
      - "AGENT_SUBSTRATE.md"
      - "authorities.json"
      - ".github/workflows/agent-substrate.yml"
      - "scientific_ai/**"
      - "tests/test_neural_*.py"
      - "tests/neural_support.py"
      - "tools/neural.py"
      - "tools/neural_ledger.py"
      - "tools/neural_legacy_audit.py"
      - "tools/pass_semantics_audit.py"
      - "tests/test_claim_hygiene.py"
      - "docs/pass_semantics_audit.json"
      - "SCIENTIFIC_AI_STATUS.md"
      - "docs/neural/**"
      - "NEURAL_SUBSTRATE.md"
      - "pyproject.toml"
      - "uv.lock"
      - "scientific/**"
      - "integrations/**"
      - "tools/**"
      - "ro_crate_tools.py"
      - "tests/test_typecheck_scope.py"
      - "docs/typing_scope.json"
  pull_request:
  workflow_dispatch:
permissions: {}            # default-deny
env:
  # NF-1T: the learned-model tests need the `neural` extra, which every sync
  # below installs. Where it is absent they FAIL instead of skipping, so a
  # job that synced the wrong environment cannot go green by skipping them.
  QTA_NEURAL_REQUIRED: "1"
jobs:
  agent-substrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read       # checkout only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86   # v5
      - name: sync environment
        run: uv sync --frozen --all-groups --extra neural
      - name: lint the substrate and the guarded Stage-10 modules
        # qta_agent/ is not in ruff's per-file-ignores, so E501 applies at the
        # project's 79-column setting like any other non-legacy module.
        run: |
          uv run ruff check qta_agent qta_multiphysics/stack \
            tests/test_agent_*.py tests/test_mutation_harness.py \
            tools/mutation_matrix.py tools/completion_matrix.py \
            tools/mutation_shards.py tests/test_mutation_shards.py \
            tools/verified_read_guard.py tests/test_verified_read_guard.py \
            tools/dependency_declarations.py \
            tests/test_dependency_declarations.py \
            scientific_ai tools/neural.py tools/neural_ledger.py \
            tools/neural_legacy_audit.py tests/neural_support.py \
            tests/test_neural_*.py tools/pass_semantics_audit.py \
            tests/test_claim_hygiene.py \
            scientific integrations tools ro_crate_tools.py \
            tests/test_typecheck_scope.py
      - name: type-check the current active scope (directive s.27)
        # mypy over every module the harness runs -- the agent substrate,
        # the generic scientific layer, the learned-model substrate, the
        # stack adapters, the FMI/FEniCSx runtimes, every tool -- with the
        # configuration in typecheck_active.ini (not pyproject.toml, which is
        # in the witness's environment lock) and no global suppression: a
        # package without type information is named there, one by one, and
        # untyped bodies are checked too. Three modules frozen by NF-1T
        # provenance have typing-only codes disabled there, and
        # tests/test_typecheck_scope.py holds that list to the real closure. Legacy QTA typing debt is recorded in
        # docs/typing_scope.json and is not this step's.
        run: uv run python tools/typecheck_scope.py check
      - name: no definition anywhere is silently shadowed
        # F811 OVER THE WHOLE TREE, not over the linted subset.
        #
        # The step above lints a named list, and qta_multiphysics/
        # deep_expdesign/ is not on it. Ruff had been reporting
        # "F811 Redefinition of unused `run_deep_expdesign_full` from line
        # 120" in that package for as long as the second copy existed, and
        # nothing read it: 176 lines of a diverged earlier draft, dead
        # because Python keeps the LAST definition of a name.
        #
        # One rule, everywhere, is the closure. The rest of ruff cannot be
        # turned on here -- the legacy scientific tree carries some 1400
        # findings, mostly E501 -- but F811 is exactly the rule for "a name
        # defined twice, the first is dead, and nothing says so", and the
        # tree is clean of it.
        run: |
          # SCOPED BY WHAT GIT TRACKS, not by a directory name.
          # `ruff check .` walks whatever is on disk. The Python 3.13 job
          # builds its environment at .venv-alt/, which is not one of ruff's
          # default excludes and is not in .gitignore, so a bare `.` would
          # lint scipy's site-packages and report its property/setter pairs.
          # The test alongside this resolves its scope the same way, so the
          # two implementations agree about WHAT is checked and differ only
          # in HOW.
          files=$(git ls-files -z '*.py' | tr '\0' '\n' | wc -l)
          test "$files" -gt 200 || { echo "git ls-files returned $files"; exit 1; }
          git ls-files -z '*.py' | xargs -0 uv run ruff check --select F811
      - name: every published number carries a dimension somebody reviewed
        # build_hdf5_mapping.py read a column's unit off the END OF ITS NAME.
        # 91 of 162 numeric columns fell through the suffix table and were
        # published into the archival HDF5 as "unresolved" -- every
        # heat-source density, every gas density, every entropy in nats, all
        # of which state their unit in their own name. Three did NOT fall
        # through and came out wrong: gradient_K_per_m ends in "_m" and was
        # published as metres; the two dose fluxes end in "_s" and were
        # published as seconds. A wrong unit is worse than none.
        #
        # Reconciled in both directions against docs/unit_inventory.json, and
        # a PER_ROW entry must name a column that is actually in that CSV's
        # header, so "the unit is in the row" is checked rather than asserted.
        run: uv run python tools/unit_inventory.py
      - name: the claims boundary is held by code that exists
        # Directive 14. CLAIMS_BOUNDARY.md states the framework's generic
        # epistemic boundaries -- a simulation result is not a measurement,
        # independent numerical agreement is not experimental validation, and
        # nine more -- and docs/claims_boundary.json names, for each, the code
        # that enforces it and the tests that hold it. This fails on a
        # required boundary missing, a module that does not define the named
        # symbol, a test that does not exist, or a boundary the page omits.
        run: uv run python tools/claims_enforcement.py
      - name: LEGACY QTA -- the QTA claims boundary is enforced, and by how much
        # The hardware-era package's own claims boundary, kept in
        # docs/legacy/qta/ with the legacy verifier that checks it: measured,
        # 19 of its 24 forbidden claims once passed package_consistency_check
        # verbatim, including "Mode B processing and Mode D sensing occur
        # simultaneously". Reconciled in both directions and re-derived rather
        # than named. It answers one bounded question -- would this EXACT
        # sentence be refused -- and not whether a paraphrase would be.
        run: uv run python tools/legacy_qta_claims.py
      - name: the workflow still runs what the matrix says it runs
        # A row claiming hosted coverage is claiming something about THIS
        # file, and nothing else here would notice this file changing.
        run: uv run python tools/workflow_contract.py
      - name: completion matrix is self-consistent
        # The matrix is a self-assessment; this is what stops it drifting.
        run: uv run python tools/completion_matrix.py
      - name: nothing folds an event it did not verify
        # D-2026-76. The snapshot-coherence tests prove the twenty repaired
        # reducers by name; this walks every production file for the next
        # one -- a raw log read, a tail parse, read_from resurrected, or the
        # log file opened directly. EventLog.read() also refuses any other
        # qta_agent module at run time; this is the static half.
        run: uv run python tools/verified_read_guard.py
      - name: every direct import is declared where it is needed
        # D-2026-74. CI installs every group, so it cannot see a package that
        # arrives only transitively; this reads pyproject.toml instead, and
        # holds stage7_reports/dependency_inventory.json to pyproject + lock.
        run: uv run python tools/dependency_declarations.py
      - name: derived artifacts are in step with their sources
        # Cheap, and it closes a hole this workflow fell into. A commit
        # changed the Snakefile without rebuilding the RO-Crate, so the crate
        # carried a checksum for a file that no longer had it. Nothing on a
        # push noticed: only release.yml runs the full pytest suite, and the
        # single test that would have caught it lives there. Both checks
        # below are seconds of work and fail on drift rather than reporting
        # it later, to nobody, at release time.
        run: |
          uv run python generate_manifest.py --check
          uv run python ro_crate_tools.py validate
      - name: the byte-reproduction witness still applies to this tree
        # docs/byte_reproduction_profile.json binds the canonical corpus,
        # the generator's measured input closure and the lock. A commit that
        # changes any of them without re-establishing the witness on a
        # backend that reproduces the corpus fails HERE, in seconds -- not as
        # an unexplained WITNESS_INAPPLICABLE on the next runner that happens
        # to dispatch differently.
        run: uv run python tools/reproduction_witness.py check
      - name: canonical reference backend recipe
        # The STAGED reference backend (reference_backend/, D-2026-102) must
        # leave no part of the arithmetic to the host: one OpenBLAS target
        # without DYNAMIC_ARCH, NumPy without runtime dispatch, one thread,
        # no FMA contraction or fast-math, every source and patch pinned, run
        # on a declared software CPU. Static: it builds nothing.
        run: uv run python tools/reference_backend.py recipe
      - name: the learned-model substrate keeps the hardware era out
        # NF-1T s.53/s.62. Every occurrence of the former apparatus's machine
        # modes, mode sequence and gas-species routing in the tracked tree,
        # classified by an ordered rule table; zero allowed in the
        # substrate, its tools, tests and evidence; none unexplained; and
        # the committed report must be the one the tree produces.
        run: uv run python tools/neural_legacy_audit.py --check
      - name: the legacy gate table's PASS count is not the current status
        # NF-1T closure. Every occurrence of the legacy QTA gate-table
        # vocabulary (PASS = 0, PASS_count, gate status, ...) classified by
        # an ordered rule table; in the current harness each must say whose
        # gates these are; zero CURRENT_AI_SEMANTIC_LEAK, none unclassified,
        # and the committed report must be the one the tree produces.
        run: uv run python tools/pass_semantics_audit.py --check
      - name: the harness completion status is the one the evidence derives
        # Harness programme. docs/harness_status.json and HARNESS_STATUS.md
        # are derived from stack.json, the completion matrix (evidence
        # recomputed from implementation digests), the audits re-run and the
        # learned-model status, against docs/harness_contract.json; a hand
        # edit, a stale copy or a status that no longer follows is refused.
        run: uv run python tools/harness_status.py verify
      - name: the learned-model evidence re-derives
        # NF-1T. Re-solves the parameter budget and compares the flagship
        # manifest's exact counts; meta-validates the ~1T configuration by
        # abstract evaluation (nothing allocated, a real allocation
        # refused); re-checks every digest link of the development chain
        # (dataset -> training -> checkpoint -> evaluation); reloads the
        # stored checkpoint; records every document in a FRESH authority
        # history and recomputes the claims, which must equal the committed
        # ones -- including that the flagship is not trained and that a
        # learned record cannot be accepted. Never trains, never allocates
        # the flagship.
        run: uv run python tools/neural.py verify
      - name: agent test suites
        run: |
          uv run python -m pytest tests/test_agent_*.py \
            tests/test_mutation_harness.py \
            tests/test_stage10_stack.py -q
      - name: the active framework reaches no legacy QTA module, file or ontology
        # Directive 10 and 28. Every production module FILE_DISPOSITION.csv
        # keeps (KEEP_*) is read from its import graph -- module-level and
        # function-level imports, and the package initialisers each import
        # runs -- and must reach no RETIRE_TO_HISTORY module, name no legacy
        # file and import no legacy-ontology module. Transitional modules are
        # counted, not enforced; the count is printed.
        run: uv run python tools/framework_boundary.py --check
      - name: identity inventory agrees with the code -- the second reader covers 40 of 40
        # Every durable action classified, every ACTOR field bound and
        # defended by a named test that exists, and the independent-reader
        # coverage MEASURED rather than claimed. A new action fails this
        # until somebody says what identity it carries. The number in the
        # title is checked (test_identity_inventory): it moved here from the
        # second reader's mutation step when the matrices were sharded.
        run: |
          uv run python tools/identity_inventory.py
      - name: bounded exhaustive model check of both state machines
        # Hypothesis explores; this exhausts. The permitted-transition graph
        # is DERIVED by interrogating the real gates over every state pair,
        # role, actor identity and evidence subset, so there is no model to
        # keep in step with the code.
        run: |
          uv run python tools/model_check.py
      - name: every test module can be collected on its own
        # D-2026-63. Three of 106 modules imported tools.* at top level with
        # no path insert of their own and passed every full run, because the
        # alphabet put a module that does insert it first. A suite whose
        # green depends on collection order is reporting the order.
        run: uv run python tools/test_isolation.py
      - name: what states the resolution of every published number
        # D-2026-66. The cross-environment split reports on a column only
        # when it crosses zero between two hosts, so its coverage was a fact
        # about which machines had run. Measured over all 162 governed
        # columns instead: 13 carry a class, 119 have no floor defined, and
        # the ones with no floor are named rather than refused -- inventing a
        # floor would be worse than admitting there is none.
        run: uv run python tools/resolution_inventory.py
      - name: the corpus allowlist describes the committed corpus
        # Adding a governed document without regenerating the allowlist is a
        # membership change nobody reviewed. This is where that fails.
        run: |
          uv run python tools/corpus_allowlist.py
      - name: long horizon at an elevated scale
        # The default scale runs with the rest of the suite on every push.
        # This is the same campaign turned up: roughly ten thousand events
        # through repeated restarts and mid-operation crashes, which is
        # where the three quadratic paths this repository has recorded each
        # became visible. A knob nobody turns is a comment.
        run: |
          QTA_HORIZON_CYCLES=1200 uv run python -m pytest \
            tests/test_agent_long_horizon.py -q -p no:randomly
      - name: fuzz the parsers and trust boundaries
        # Two jobs: replay every committed regression input, then run a
        # bounded seeded campaign. A finding fails the build. The campaign is
        # a floor, not a fuzzing programme -- see tests/fuzz_corpus/README.md.
        #
        # The floors are the anti-vacuity check. "No findings" is the same
        # sentence over a full campaign and an empty one, so the run has to
        # state how much it reached: a target that raises at import or a
        # mutation operator that started returning b"" collapses these
        # numbers long before it stops printing "no findings". Set well
        # below what a healthy run measures (2814 lines, 72 transitions)
        # so ordinary variation passes and a collapse does not.
        run: |
          uv run python tools/fuzz_substrate.py --cases 2000 \
            --min-lines 2200 --min-features 55
      - name: the governed production path actually runs
        # The point of a production caller is that it is exercised. This runs
        # the real Snakemake rule, not a test double, and s10_governed fails
        # the build unless the run reaches VERIFIED.
        run: uv run snakemake --cores 1 s10_governed
      - name: the read-only auditor answers for that run
        # Immediately after the governed rule, over the log it just wrote --
        # a real history, not a fixture built to pass. Each command exits
        # non-zero on a FINDING, so a provenance gap or a transition the
        # machine would refuse today fails the build here rather than being
        # printed into a log nobody reads.
        #
        # It also proves the auditor still runs. A committed audit tool that
        # nothing invokes rots exactly as fast as the API underneath it
        # changes, and is discovered to be broken during the incident it
        # exists for.
        run: |
          LOG=verification/stage10/governed/task_log.jsonl
          uv run python tools/audit_log.py "$LOG" verify
          uv run python tools/audit_log.py "$LOG" gaps
          uv run python tools/audit_log.py "$LOG" replay
          uv run python tools/audit_log.py "$LOG" decisions --all
      - name: the governed scientific-model path actually runs
        # The production caller of qta_agent.governed_model: thermal 1D run
        # and independently checked as two governed tasks, decided through
        # the authority store's content rule, then proposed again and
        # REUSED without a second model run -- and recomputed for other
        # parameters; then thermal 2D (adiabatic sides) by the same line,
        # checked by the 3D solver. The rule fails the build on any of
        # those, and the auditor then answers for the history it wrote --
        # its replay given the evidence store, so it re-decides each
        # scientific admission itself; one it cannot decide is a finding.
        # Then the generic consistency verifier, the framework's successor
        # to the legacy QTA verifier, takes its verdict on the same history:
        # chain, evidence, both readers and their agreement, the scientific
        # artifacts, model and check identity.
        run: |
          uv run snakemake --cores 1 s10_governed_model
          LOG=verification/stage10/governed_model/task_log.jsonl
          uv run python tools/audit_log.py "$LOG" verify
          uv run python tools/audit_log.py "$LOG" gaps
          uv run python tools/audit_log.py "$LOG" replay \
            --evidence verification/stage10/governed_model/evidence
          uv run python tools/audit_log.py "$LOG" decisions --all
          uv run python tools/generic_consistency.py "$LOG" \
            --evidence verification/stage10/governed_model/evidence
      - name: sources are unchanged after this job's steps
        # The mutation matrices run in the mutation-shards job now, each
        # shard checking the tree with git itself. This still catches a
        # suite, the fuzzer or the governed run leaving the tree modified.
        run: |
          if ! git diff --quiet; then
            echo "mutation testing left the working tree modified:"
            git --no-pager diff --stat
            exit 1
          fi
          echo "working tree clean"
      - name: the substrate did not touch the canonical tree
        run: |
          uv run python generate_manifest.py --check

  mutation-shards:
    # Every mutation specification, split into deterministic shards so no
    # single runner holds four and a half hours of verdicts (the serial job
    # took 4h27m at d633c77, run 36094744039). The matrix below is GENERATED
    # by tools/mutation_shards.py --emit and checked by --check and by
    # workflow_contract.py: every spec in exactly one shard, every cycle.
    # Each spec still runs through tools/mutation_matrix.py unchanged --
    # baseline, null control, non-zero on a survivor, a stale or ambiguous
    # anchor, a timeout or a source not restored byte-identical -- and the
    # shard runs every spec it holds even after one fails, then checks the
    # tracked tree with git.
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # BEGIN generated by tools/mutation_shards.py --emit
          - shard: 1
            specs: >-
              tools/mutations/agent_second_reader.json
              tools/mutations/corpus_allowlist.json
              tools/mutations/dependency_declarations.json
              tools/mutations/mutation_shards.json
              tools/mutations/neural_tokens.json
              tools/mutations/resolution_inventory.json
              tools/mutations/stress_campaign_coverage.json
              tools/mutations/task_execution_phase.json
          - shard: 2
            specs: >-
              tools/mutations/agent_memory_context.json
              tools/mutations/agent_netauth.json
              tools/mutations/agent_snapshot_coherence.json
              tools/mutations/agent_tasks.json
              tools/mutations/authority_result_rules.json
              tools/mutations/canonical_output_set.json
              tools/mutations/scientific_authority_replay.json
              tools/mutations/scientific_interfaces.json
              tools/mutations/test_isolation.json
              tools/mutations/verified_read_guard.json
          - shard: 3
            specs: >-
              tools/mutations/agent_agents.json
              tools/mutations/agent_delegation.json
              tools/mutations/agent_lease_renewal.json
              tools/mutations/agent_secret_provider.json
              tools/mutations/claims_boundary.json
              tools/mutations/external_models.json
              tools/mutations/governed_model_reuse.json
              tools/mutations/neural_routing.json
              tools/mutations/output_resolution.json
              tools/mutations/reproduction_policy.json
              tools/mutations/run_identity_backend.json
              tools/mutations/solver_failclosed.json
          - shard: 4
            specs: >-
              tools/mutations/agent_evidence.json
              tools/mutations/agent_policy.json
              tools/mutations/agent_scheduler.json
              tools/mutations/backend_probe.json
              tools/mutations/hdf5_bundle.json
              tools/mutations/mutation_harness.json
              tools/mutations/neural_accounting.json
              tools/mutations/quantity_resolution.json
              tools/mutations/replay_origin_view.json
              tools/mutations/scientific_invalidation.json
              tools/mutations/second_reader_audit_actions.json
              tools/mutations/typecheck_scope.json
              tools/mutations/unit_inventory.json
          - shard: 5
            specs: >-
              tools/mutations/agent_substrate.json
              tools/mutations/claim_hygiene.json
              tools/mutations/completion_matrix.json
              tools/mutations/cross_environment.json
              tools/mutations/fuzz_harness.json
              tools/mutations/governed_breadth.json
              tools/mutations/neural_parallel.json
              tools/mutations/neural_training.json
              tools/mutations/proposal_crash_recovery.json
              tools/mutations/proposal_ingress.json
              tools/mutations/ranking_equivalence.json
              tools/mutations/rust_selection.json
              tools/mutations/surface_adsorption.json
          - shard: 6
            specs: >-
              tools/mutations/agent_checkpoint.json
              tools/mutations/agent_fault_injection.json
              tools/mutations/agent_idempotency.json
              tools/mutations/agent_incremental.json
              tools/mutations/agent_readpath.json
              tools/mutations/agent_service_authority.json
              tools/mutations/checkpoint_recovery.json
              tools/mutations/enforcement_asserts.json
              tools/mutations/generic_consistency.json
              tools/mutations/harness_status.json
              tools/mutations/repo_contract.json
              tools/mutations/stage10_authority.json
              tools/mutations/supply_chain.json
          - shard: 7
            specs: >-
              tools/mutations/agent_cross_process.json
              tools/mutations/agent_execution.json
              tools/mutations/agent_recovery.json
              tools/mutations/agent_secrets.json
              tools/mutations/authenticated_history.json
              tools/mutations/decided_appends.json
              tools/mutations/neural_authority.json
              tools/mutations/performance_counters.json
              tools/mutations/reference_backend.json
              tools/mutations/ro_crate_conformance.json
              tools/mutations/scientific_thermal_1d.json
              tools/mutations/scientific_thermal_2d.json
              tools/mutations/workflow_generic.json
          - shard: 8
            specs: >-
              tools/mutations/actor_authentication.json
              tools/mutations/agent_actions.json
              tools/mutations/agent_audit.json
              tools/mutations/agent_compensation.json
              tools/mutations/agent_job_graph.json
              tools/mutations/agent_separate_verify.json
              tools/mutations/framework_boundary.json
              tools/mutations/harness_demo.json
              tools/mutations/harness_integrations.json
              tools/mutations/identity_inventory.json
              tools/mutations/model_check.json
              tools/mutations/performance_telemetry.json
              tools/mutations/signed_append_lifecycle.json
          # END generated by tools/mutation_shards.py --emit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86   # v5
      - name: sync environment
        run: uv sync --frozen --all-groups --extra neural
      - name: mutation matrices, shard ${{ matrix.shard }}
        run: uv run python tools/mutation_shards.py --run ${{ matrix.specs }}
      - name: the shard left the tree exactly as it found it
        # always(): a shard that failed, or was cut short, is exactly the one
        # most likely to have left a mutated source, a staged change or a
        # test's probe file behind -- and those are checked by git itself,
        # not by the harness that might have been the thing that died.
        if: always()
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          stray="$(git ls-files --others --exclude-standard)"
          if [ -n "$stray" ]; then
            echo "files left behind by the shard:"
            echo "$stray"
            exit 1
          fi

  mutation-matrices:
    # The aggregate, and the only mutation verdict to read. It runs always(),
    # so a failed or cancelled shard makes it red rather than skipped, and it
    # is green only when the shard job's result is success -- which GitHub
    # reports only when EVERY matrix leg succeeded. A lost runner is
    # therefore never read as a pass, and nothing here infers a kill from a
    # shard's silence.
    needs: [mutation-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86   # v5
      - name: sync environment
        run: uv sync --frozen --all-groups --extra neural
      - name: every shard passed, and the shards cover every spec
        env:
          SHARDS: ${{ needs.mutation-shards.result }}
        run: |
          if [ "$SHARDS" != "success" ]; then
            echo "mutation-shards result: $SHARDS -- not every shard passed"
            exit 1
          fi
          uv run python tools/mutation_shards.py --check

  full-suite:
    # Deliberately a separate job. Serialising it behind the mutation matrices
    # would mean the cheapest, broadest signal in this workflow arrives last.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86   # v5
      - name: sync environment
        run: uv sync --frozen --all-groups --extra neural
      - name: the FULL pytest suite, not only the agent suites
        # FIRST, and that ordering is the point. While the package check ran
        # first, `set -e` meant the broadest signal in this workflow never
        # executed at all whenever the check refused -- the same defect as
        # the 3D diagnostic once ordered behind the check it exists to
        # explain.
        run: uv run python -m pytest tests/ -q
      - name: the numerical backend this runner regenerates on
        # Reports; gates nothing by itself. The verdict below does NOT read
        # this process: it reads the identity the regenerating process
        # recorded about itself (tools/regenerate_instrumented.py). This is
        # the same probe in a fresh process with the same environment, so a
        # reader of the log sees which backend, and how it differs from the
        # witness profile's, before the verdict says what that means.
        run: uv run python tools/reproduction_witness.py identity
      - name: package consistency -- the portable question
        # --policy ci (directive 7). This job used to run the strict byte
        # comparison and was documented EXPECTED RED whenever GitHub
        # assigned a CPU whose dispatch differs from the witness's -- a
        # required job red by design, which is how a real failure hides.
        #
        # Now GREEN means one of exactly two things, and the log says which:
        #   BYTE_IDENTICAL -- this runner reproduced every canonical byte;
        #   DIFFERENT_RESOLVED_BACKEND + DECISION_STABLE_WITH_NUMERIC_DRIFT
        #     -- a resolved backend the witness never saw; digits differ, and
        #     every structural and decision-bearing fact agrees. NOT a
        #     reproduction, and scientific equivalence NOT_ESTABLISHED.
        # RED means an actionable defect: drift on a witnessed backend, an
        # unresolved backend, a witness profile that no longer applies, or
        # any structural, decision, non-finite, unclassified or unbound
        # resolution difference. Nothing is tolerated, widened or exempted.
        run: >-
          uv run python package_consistency_check.py --policy ci
          --summary-json "${RUNNER_TEMP}/reproduction_verdict.json"
      - name: the reproduction verdict, machine-readable
        if: always()
        run: |
          uv run python - <<'PY'
          import json, os, pathlib, sys
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "reproduction_verdict.json"
          if not p.exists():
              sys.exit("no reproduction verdict was written")
          v = json.loads(p.read_text())
          for k in ("policy", "PACKAGE_STATUS", "BACKEND_STATUS",
                    "REPRODUCTION_STATUS", "CROSS_ENV_STATUS",
                    "SCIENTIFIC_EQUIVALENCE_STATUS", "files_byte_compared",
                    "files_differing", "backend_digest", "witness"):
              print(f"{k}={v.get(k)}")
          for r in v.get("reasons", []):
              print(f"  reason: {r}")
          PY
      - name: the comparator's own view of this runner's regeneration
        # The same comparison the verdict above ran when the backend
        # differed, standalone: IDENTICAL trees, or every class it found.
        if: always()
        run: uv run python tools/cross_env_semantics.py outputs/ .
      - name: which numbers a clip decided, and what says so in the file
        # The step above reports that a zero moved between two runners. This
        # one answers the question that makes such a report actionable: was
        # the number the model's, or the clip's?
        #
        # gas_transport_profile.csv stated 0.000000000e+00 for methane in all
        # 120 Mode-C cells while the solve had produced noise between -1.9e+01
        # and -1.8e-10, inside its own atol of 1e3. Helium's zero in the same
        # file is exact. Both were written identically, so a reader could not
        # tell "absent by design" from "below what this method can see" -- and
        # residual_mode_D_density_m3 is a contamination claim.
        #
        # ALWAYS: a measurement that only runs when everything already passed
        # measures nothing that matters.
        #
        # Every numpy.clip in the scientific tree is instrumented during a
        # real canonical run -- the same three entry points qta_full_sim.py
        # drives -- and reconciled against docs/clip_provenance.json. Reading
        # the source would have found the two gas-transport sites; it would
        # not have established that the others never fire. A run that observed
        # no clip at all is a refusal, not a pass.
        if: always()
        run: uv run python tools/clip_provenance.py

  dispatch-sensitivity:
    # THE SWEEP THAT SHOULD HAVE RUN BEFORE 0358af0.
    #
    # The full suite again, on a NumPy with AVX-512 turned off, and the
    # package check's DIFFERENT-BACKEND path with it (directive 7). Two defects
    # in one day came out of this configuration and neither was visible to
    # any job above:
    #
    #   D-2026-53a -- a test defending the finding that the sign of the
    #     Mode-C methane noise is host-dependent had PINNED that sign. Here
    #     18 of 120 cells go positive and the clip leaves them in the file.
    #   D-2026-58 -- conductivity_power_law is REJECTED at 2 ulp against a
    #     NumPy with AVX-512 and BIT-IDENTICAL, hence adopted, without it.
    #     Which backend dispatch() selects was a property of the host, and
    #     STACK.md, stack.json and a test all recorded one host's answer.
    #
    # GitHub's runners have AVX-512, so full-suite exercises one side of
    # this and only one. Disabling the feature is the cheapest way to have
    # the other side measured on every commit instead of remembered.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86   # v5
      - name: sync environment
        # --all-groups, as every sibling job uses. `--group stack` was
        # invented rather than copied and is not a group at all: pyproject
        # defines `dev` and `workflow`, and uv refused in one second with
        # "Group `stack` is not defined". It never showed locally because a
        # local run reuses an already-synced .venv and never executes this
        # line. tools/workflow_contract.py now checks that every --group a
        # workflow names actually exists.
        run: uv sync --frozen --all-groups --extra neural
      - name: the dispatch this job is here to exercise
        # Reports, gates nothing -- but a job whose whole purpose is a
        # different dispatch must show that it got one, or a silently
        # ignored environment variable turns it into a duplicate of
        # full-suite that nobody would notice.
        run: |
          uv run python - <<'PY'
          import numpy
          simd = numpy.show_config(mode="dicts")["SIMD Extensions"]
          print("baseline:", simd.get("baseline"))
          print("found:   ", simd.get("found"))
          assert "X86_V4" not in (simd.get("found") or []),               "X86_V4 is still in force; this job is not testing anything new"
          PY
        env:
          OPENBLAS_CORETYPE: Haswell
          NPY_DISABLE_CPU_FEATURES: X86_V4 AVX512_ICL AVX512_SPR
      - name: the FULL suite, on the other side of the dispatch
        run: uv run python -m pytest tests/ -q
        env:
          OPENBLAS_CORETYPE: Haswell
          NPY_DISABLE_CPU_FEATURES: X86_V4 AVX512_ICL AVX512_SPR
      - name: package consistency, on a backend the witness never saw
        # The different-backend path, made to RUN on every commit rather
        # than whenever GitHub happens to assign a CPU without AVX-512.
        run: >-
          uv run python package_consistency_check.py --policy ci
          --summary-json "${RUNNER_TEMP}/reproduction_verdict.json"
        env:
          OPENBLAS_CORETYPE: Haswell
          NPY_DISABLE_CPU_FEATURES: X86_V4 AVX512_ICL AVX512_SPR
      - name: the different-backend path actually compared something
        # ANTI-VACUITY for the step above. A dispatch override that was
        # silently ignored would make this a second byte-identical run and
        # the path nobody exercised would still read green. No file counts
        # are hard-coded: the claim is only that the backend differed, that
        # something differed because of it, that it was compared, and that
        # nothing but numeric digits did.
        run: |
          uv run python - <<'PY'
          import json, os, pathlib, sys
          v = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])
                          / "reproduction_verdict.json").read_text())
          c = (v.get("cross_env") or {}).get("counts", {})
          checks = {
              "backend resolved": v.get("BACKEND_STATUS") == "RESOLVED",
              "not byte-identical": v.get("REPRODUCTION_STATUS")
                  == "DIFFERENT_RESOLVED_BACKEND",
              "decision-stable": v.get("CROSS_ENV_STATUS")
                  == "DECISION_STABLE_WITH_NUMERIC_DRIFT",
              "equivalence not claimed":
                  v.get("SCIENTIFIC_EQUIVALENCE_STATUS") == "NOT_ESTABLISHED",
              "a file differed": v.get("files_differing", 0) >= 1,
              "leaves compared":
                  (v.get("cross_env") or {}).get("leaves_compared", 0) > 0,
          }
          for k in ("STRUCTURAL", "DECISION", "DISCRETE", "NONFINITE",
                    "UNCLASSIFIED", "ZERO_CROSSING_BARE", "SIGN_FLIP_BARE"):
              checks[f"no {k}"] = c.get(k, -1) == 0
          for k, ok in checks.items():
              print(("PASS " if ok else "FAIL ") + k)
          print("counts:", json.dumps(c, sort_keys=True))
          sys.exit(0 if all(checks.values()) else 1)
          PY

  second-interpreter:
    # The guarantees under test are pure-Python and stdlib-only. Running them
    # on another interpreter answers a question the pinned job cannot: whether
    # any of this depends on 3.12 specifically.
    #
    # NOT `uv sync`: the lockfile resolves for 3.12 and would refuse.
    #
    # numpy and scipy are here for ONE reason, established by running it:
    # qta_multiphysics/__init__.py eagerly imports the runner, so the
    # governed Stage-10 tool -- a stdlib-only module -- cannot be imported
    # in its subprocess without them. They are installed UNPINNED and
    # nothing here executes a solver or reads a number out of one; this job
    # tests the authority layer and claims nothing about the science.
    # h5py is here for one reason too: the fuzz campaign's targets are built
    # together, and one of them is the HDF5 result-bundle reader -- a trust
    # boundary reading untrusted files, fuzzed here like every other one
    # rather than dropped where its library is absent.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86   # v5
      - name: a bare environment on Python ${{ matrix.python }}
        run: |
          uv venv --python ${{ matrix.python }} .venv-alt
          uv pip install --python .venv-alt pytest hypothesis \
            numpy scipy h5py
      - name: the interpreter is actually the one we asked for
        run: |
          .venv-alt/bin/python -c "import sys; \
            assert sys.version_info[:2] == tuple(int(x) for x in \
            '${{ matrix.python }}'.split('.')), sys.version; \
            print(sys.version)"
      - name: agent suites on Python ${{ matrix.python }}
        run: .venv-alt/bin/python -m pytest tests/test_agent_*.py -q

  cross-environment-3d:
    # R59. The question was never "is there a divergence" -- it was that the
    # only instrument able to answer had its evidence behind a signed URL on
    # a storage host some egress policies refuse, so the measurement could
    # not be read back. The answer is to make the measurement print itself.
    #
    # This runs the same collector the container runs, on a THIRD kind of
    # machine, and emits the comparison as ::QTA-3D-*:: lines that the
    # job-logs API serves directly. No artifact, no redirect, no host that
    # can be denied.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86   # v5
      - name: sync environment
        run: uv sync --frozen --all-groups --extra neural
      - name: regenerate the 3D outputs and compare against the committed copies
        # DIAGNOSTIC. It reports a divergence and never fails on one: a tool
        # that could fail the build on a byte difference would be a gate,
        # and nothing here is allowed to be one.
        run: |
          uv run python analysis/collect_container_3d.py \
            "${RUNNER_TEMP}/qta-3d" --emit-summary
      - name: the diagnostic actually COMPARED something
        # ANTI-VACUITY, and the previous version of this step was not enough.
        #
        # It asserted only that 63 files were REGENERATED. A hosted run then
        # printed "IDENTICAL (0/63 byte-identical)" while comparing nothing:
        # the collector was looking for the canonical copies under the wrong
        # path, so all 63 landed in not_committed, differing was zero because
        # nothing was compared, and this step passed on a true statement
        # about the wrong quantity.
        #
        # So every number now has to close. Regenerating is not comparing.
        run: |
          uv run python - <<'PY'
          import json, os, pathlib, sys
          meta = pathlib.Path(os.environ["RUNNER_TEMP"]) / "qta-3d" / "meta"
          c = json.loads((meta / "comparison.json").read_text())
          print(json.dumps(c, indent=1, sort_keys=True))
          problems = []
          if c["regenerated"] < 60:
              problems.append(
                  f"only {c['regenerated']} file(s) regenerated, below 60")
          if c["not_committed"]:
              problems.append(
                  f"{c['not_committed']} regenerated file(s) had no "
                  "committed copy to compare against, so they were NOT "
                  f"compared: {c['not_committed_files'][:5]}")
          if c["identical"] + c["differing"] != c["regenerated"]:
              problems.append(
                  f"{c['identical']} identical + {c['differing']} differing "
                  f"!= {c['regenerated']} regenerated")
          if problems:
              sys.exit("the comparison did not measure what it reports on:\n"
                       + "\n".join("  - " + p for p in problems))
          print(f"COMPARED {c['regenerated']} files: {c['identical']} "
                f"identical, {c['differing']} differing, "
                f"{c['not_committed']} uncompared")
          PY
      - name: which BLAS kernel this runner selected, and how much it matters
        # THE ANSWER R59 WAS LOOKING FOR, measured on the runner rather than
        # inferred from it. OpenBLAS DYNAMIC_ARCH picks a kernel from the
        # host CPU's flags; the kernels differ in accumulation order, so
        # they differ in the last bits a sixteen-digit CSV records.
        #
        # Forcing OPENBLAS_CORETYPE makes "another environment" a variable
        # on ONE machine, which is the only way to attribute a byte
        # difference to the kernel rather than to everything else that also
        # differs between two hosts. Several full regenerations, so it is
        # slow; it runs here because this job is the one that exists to
        # answer this question.
        run: |
          uv run python tools/blas_kernel_sensitivity.py \
            --out "${RUNNER_TEMP}/blas_sensitivity.json"
