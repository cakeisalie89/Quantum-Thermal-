# Container runtime verification -- built and run on every push to this
# branch, non-authoritative.
#
# WHY IT RUNS HOSTED. Locally the Docker daemon runs and the Docker Hub
# manifest endpoint is reachable, but the layer blobs live on
# production.cloudfront.docker.com, which the sandbox egress proxy denies with
# a 403 on CONNECT; substituting a different base image would test a different
# artifact than the Dockerfile declares. A GitHub-hosted runner can pull them.
# This workflow builds the declared image there -- same Dockerfile, same
# digest-pinned base, same entrypoint, same non-root user -- and runs it.
#
# HISTORY, measured (container_verification.md): the dispatched runs from
# 2026-08-23 built the image and ran it as the non-root user every time after
# the first; their first failures were a root-owned working directory and
# governed files hidden by .dockerignore, both fixed in the Dockerfile.
#
# NON-AUTHORITATIVE. Nothing here can move a result, a threshold or an
# authority state. It grants `contents: read` and nothing else -- no id-token, no write of
# any kind -- so it cannot sign, push or comment. Its products are evidence:
# whether the declared image builds, runs, and passes its in-image
# verification, and the identity (config digest, layers) of the image that did.
name: container-verify
on:
  # Every push to this branch builds and runs the declared image: a
  # dispatch-only trigger cannot fire until the workflow reaches the default
  # branch, and evidence about the container must be about the commit it ran
  # on, not one dispatched by hand weeks earlier.
  push:
    branches: ["claude/scientific-python-stack-7rsq3m"]
  workflow_dispatch:
permissions: {}             # default-deny
jobs:
  container-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read        # checkout only; deliberately nothing else
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with: {persist-credentials: false}

      - name: record the runtime that is actually present
        run: |
          echo "== docker client/server =="
          docker version || { echo "NO USABLE DOCKER DAEMON ON THIS RUNNER"; exit 1; }
          echo "== declared base image =="
          grep -E '^FROM ' Dockerfile

      # The base digest is read from the Dockerfile rather than restated here,
      # so this step cannot drift from the artifact under test.
      - name: pull the exact digest-pinned base and confirm it
        run: |
          BASE=$(grep -E '^FROM ' Dockerfile | awk '{print $2}')
          echo "base=$BASE"
          case "$BASE" in
            *@sha256:*) : ;;
            *) echo "BASE IS NOT DIGEST-PINNED: $BASE"; exit 1 ;;
          esac
          WANT=${BASE##*@}
          docker pull "$BASE"
          # RepoDigests carries the digest the registry actually served. The
          # comparison is against the Dockerfile's pin, not against itself.
          GOT=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$BASE")
          echo "want=$WANT"
          echo "resolved:"; echo "$GOT"
          echo "$GOT" | grep -qF "$WANT" \
            || { echo "DIGEST MISMATCH: pinned $WANT not among resolved digests"; exit 1; }
          echo "digest pin confirmed against the served manifest"

      - name: build the declared image
        run: docker build -t harness:hosted-verify .

      - name: confirm the image runs as the declared non-root user
        run: |
          U=$(docker run --rm harness:hosted-verify id -un)
          echo "container user: $U"
          [ "$U" = "harness" ] || { echo "EXPECTED USER harness, GOT $U"; exit 1; }
          docker run --rm harness:hosted-verify sh -c 'echo "PATH=$PATH"; command -v python'

      # No host .venv is mounted anywhere; the image must be self-sufficient.
      - name: confirm no dependency on a host virtualenv
        run: |
          docker run --rm harness:hosted-verify python -c \
            "import sys; print(sys.prefix); assert '/opt/venv' in sys.prefix, sys.prefix"
          docker run --rm harness:hosted-verify python -c \
            "import numpy, scipy, h5py; print(numpy.__version__, scipy.__version__, h5py.__version__)"

      # The governed verification the container declares as its entrypoint.
      - name: run the governed in-container verification
        # the evidence directory is mounted so the in-image demonstration's
        # report can be compared with a native run below; the image's user
        # (harness) writes it, so the directory is made writable first
        run: |
          mkdir -p container-evidence
          chmod 0777 container-evidence
          docker run --rm -e HARNESS_EVIDENCE_DIR=/evidence \
            -v "$PWD/container-evidence:/evidence" harness:hosted-verify

      # The same demonstration natively, compared with the
      # container's under the equivalence policy. Byte equality is not
      # required where the numerical backend legitimately differs; the
      # comparison classifies the slab result (BYTE_IDENTICAL,
      # EQUIVALENT_AT_DECLARED_RESOLUTION, NOT_EQUIVALENT or NOT_ESTABLISHED)
      # and requires both runs to reach the same authority outcome.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86   # v5
      - name: the same demonstration natively, compared with the container's
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          uv run python tools/harness_demo.py run --out container-evidence/harness_demo_native.json
          uv run python tools/harness_demo.py compare \
            container-evidence/harness_demo_container.json \
            container-evidence/harness_demo_native.json \
            --out container-evidence/harness_demo_comparison.json

      - name: preserve evidence
        if: always()
        run: |
          mkdir -p container-evidence
          { docker version; echo; docker images harness:hosted-verify; } \
            > container-evidence/runtime.txt 2>&1 || true
          # the image's identity: its config digest and every layer, so the
          # evidence names the exact image that ran, not a tag
          docker image inspect --format \
            '{"image_id": "{{.Id}}", "layers": {{json .RootFS.Layers}}, "source_sha": "'"$GITHUB_SHA"'"}' \
            harness:hosted-verify > container-evidence/image_identity.json 2>&1 || true
          cat container-evidence/image_identity.json || true
          grep -E '^FROM |^USER |^CMD ' Dockerfile > container-evidence/declared.txt || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        if: always()
        with:
          name: container-runtime-evidence
          path: container-evidence/
          if-no-files-found: warn
