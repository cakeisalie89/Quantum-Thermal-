# Container runtime verification -- manually dispatched, non-authoritative.
#
# WHY THIS EXISTS. The declared container has been reviewed statically but never
# executed. Locally that is not fixable: the Docker daemon runs (client and
# server 29.3.1) and the Docker Hub manifest endpoint is reachable, but the
# layer blobs live on production.cloudfront.docker.com, which the sandbox egress
# proxy denies with a 403 on CONNECT. Substituting a different base image would
# test a different artifact than the Dockerfile declares, so it was not done.
#
# A GitHub-hosted runner is a different network, and ubuntu-latest images ship a
# Docker daemon. This workflow tries the declared build there. It changes
# nothing about the container: same Dockerfile, same digest-pinned base, same
# entrypoint, same non-root user.
#
# NON-AUTHORITATIVE. Nothing here can move a gate, a threshold or an authority
# state. It grants `contents: read` and nothing else -- no id-token, no write of
# any kind -- so it cannot sign, push or comment. Its only product is evidence
# that the declared container does or does not build and run.
#
# STATUS UNTIL IT RUNS: the availability of a usable Docker daemon on the hosted
# runner is documented by GitHub but NOT verified here. This workflow is the
# means of verifying it, not a claim that it works.
name: qta-container-verify
on:
  workflow_dispatch:        # manual only
permissions: {}             # default-deny
jobs:
  container-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read        # checkout only; deliberately nothing else
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with: {persist-credentials: false}

      - name: record the runtime that is actually present
        run: |
          echo "== docker client/server =="
          docker version || { echo "NO USABLE DOCKER DAEMON ON THIS RUNNER"; exit 1; }
          echo "== declared base image =="
          grep -E '^FROM ' Dockerfile

      # The base digest is read from the Dockerfile rather than restated here,
      # so this step cannot drift from the artifact under test.
      - name: pull the exact digest-pinned base and confirm it
        run: |
          BASE=$(grep -E '^FROM ' Dockerfile | awk '{print $2}')
          echo "base=$BASE"
          case "$BASE" in
            *@sha256:*) : ;;
            *) echo "BASE IS NOT DIGEST-PINNED: $BASE"; exit 1 ;;
          esac
          WANT=${BASE##*@}
          docker pull "$BASE"
          # RepoDigests carries the digest the registry actually served. The
          # comparison is against the Dockerfile's pin, not against itself.
          GOT=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$BASE")
          echo "want=$WANT"
          echo "resolved:"; echo "$GOT"
          echo "$GOT" | grep -qF "$WANT" \
            || { echo "DIGEST MISMATCH: pinned $WANT not among resolved digests"; exit 1; }
          echo "digest pin confirmed against the served manifest"

      - name: build the declared image
        run: docker build -t qta:hosted-verify .

      - name: confirm the image runs as the declared non-root user
        run: |
          U=$(docker run --rm qta:hosted-verify id -un)
          echo "container user: $U"
          [ "$U" = "qta" ] || { echo "EXPECTED USER qta, GOT $U"; exit 1; }
          docker run --rm qta:hosted-verify sh -c 'echo "PATH=$PATH"; command -v python'

      # No host .venv is mounted anywhere; the image must be self-sufficient.
      - name: confirm no dependency on a host virtualenv
        run: |
          docker run --rm qta:hosted-verify python -c \
            "import sys; print(sys.prefix); assert '/opt/venv' in sys.prefix, sys.prefix"
          docker run --rm qta:hosted-verify python -c \
            "import numpy, scipy, qutip, h5py; print(numpy.__version__, scipy.__version__, qutip.__version__, h5py.__version__)"

      # The governed verification the container declares as its entrypoint.
      # This is the step that would raise the evidence state from RUNTIME_BUILT
      # to RUNTIME_SCIENTIFICALLY_REPRODUCED.
      - name: run the governed in-container verification
        run: docker run --rm qta:hosted-verify

      # ---- DIAGNOSTIC ONLY (investigation branch) --------------------------
      # Purpose: obtain artifact set C -- the bytes the container ACTUALLY
      # regenerates -- because the local sandbox cannot build this image
      # (production.cloudfront.docker.com denies layer blobs with 403).
      #
      # This step does NOT touch the governed verification above. That step is
      # unchanged and is still allowed to fail; `if: always()` here only means
      # the evidence survives the failure. A red run carrying the bytes is
      # worth more than a green one that proved nothing.
      #
      # Regeneration writes into an EMPTY bind-mounted directory, never the
      # repository root, so the captured bytes cannot be the committed copies
      # read back by accident.
      - name: DIAGNOSTIC capture fresh container regeneration + fingerprint
        if: always()
        run: |
          mkdir -p diag/outputs diag/meta
          cat > diag/meta/collect.py <<'PY'
          import hashlib, json, os, platform, subprocess, sys
          from pathlib import Path
          fp = {"python": sys.version.split()[0],
                "platform": platform.platform(),
                "machine": platform.machine()}
          import numpy, scipy, h5py
          fp.update(numpy=numpy.__version__, scipy=scipy.__version__,
                    h5py=h5py.__version__)
          try:
              import qutip; fp["qutip"] = qutip.__version__
          except Exception as e:
              fp["qutip"] = repr(e)
          try:
              cfg = numpy.show_config(mode="dicts")
              bd = cfg.get("Build Dependencies", {})
              fp["blas"] = bd.get("blas", {})
              fp["lapack"] = bd.get("lapack", {})
              fp["simd"] = cfg.get("SIMD Extensions", {})
          except Exception as e:
              fp["show_config"] = repr(e)
          for v in ("OMP_NUM_THREADS","OPENBLAS_NUM_THREADS","MKL_NUM_THREADS",
                    "BLIS_NUM_THREADS","NUMEXPR_NUM_THREADS",
                    "VECLIB_MAXIMUM_THREADS","PYTHONHASHSEED","LANG","LC_ALL",
                    "TZ","GITHUB_SHA","GITHUB_REF","GITHUB_WORKFLOW",
                    "GITHUB_RUN_ID","RUNNER_OS"):
              fp[v] = os.environ.get(v)
          cpu = {"count": os.cpu_count()}
          try:
              for line in open("/proc/cpuinfo"):
                  if line.startswith("model name") and "model" not in cpu:
                      cpu["model"] = line.split(":", 1)[1].strip()
                  if line.startswith("flags") and "flags" not in cpu:
                      cpu["flags"] = line.split(":", 1)[1].split()
          except OSError as e:
              cpu["error"] = repr(e)
          fp["cpu"] = cpu
          try:
              fp["uname"] = subprocess.run(["uname","-a"], capture_output=True,
                                           text=True).stdout.strip()
          except Exception as e:
              fp["uname"] = repr(e)
          Path("/diag/meta/fingerprint_hosted.json").write_text(
              json.dumps(fp, indent=1, sort_keys=True))

          # FRESH regeneration into an empty directory.
          out = Path("/diag/outputs")
          from qta_multiphysics.runner_3d import run_3d_all
          from qta_multiphysics.runner import run_all
          run_3d_all(out, heavy=False, verbose=False)
          run_all(out, verbose=False)

          inv = {}
          for f in sorted(out.iterdir()):
              if f.is_file():
                  b = f.read_bytes()
                  inv[f.name] = {"sha256": hashlib.sha256(b).hexdigest(),
                                 "size": len(b)}
          Path("/diag/meta/hosted_3d_hashes.json").write_text(
              json.dumps({"provenance": "freshly regenerated inside the "
                          "container into an empty bind mount; NOT the "
                          "committed repository copies",
                          "github_sha": os.environ.get("GITHUB_SHA"),
                          "files": inv}, indent=1, sort_keys=True))
          print(f"captured {len(inv)} regenerated files")
          PY
          docker run --rm -v "$PWD/diag:/diag" -w /qta qta:hosted-verify \
            python /diag/meta/collect.py
          echo "--- captured:"; ls -1 diag/outputs | head -40

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        if: always()
        with:
          name: container-3d-diagnostic
          path: diag/
          if-no-files-found: warn

      - name: preserve evidence
        if: always()
        run: |
          mkdir -p container-evidence
          { docker version; echo; docker images qta:hosted-verify; } \
            > container-evidence/runtime.txt 2>&1 || true
          grep -E '^FROM |^USER |^CMD ' Dockerfile > container-evidence/declared.txt || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        if: always()
        with:
          name: container-runtime-evidence
          path: container-evidence/
          if-no-files-found: warn
