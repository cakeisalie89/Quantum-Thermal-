name: qta-source-snapshot
on:
  push:
    branches:
      - claude/scientific-python-stack-7rsq3m
    paths:
      - .github/workflows/source-snapshot.yml
  workflow_dispatch:
permissions: {}
jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Create source snapshot
        run: |
          tar --exclude=.git -czf "$RUNNER_TEMP/qta-source.tgz" .
          sha256sum "$RUNNER_TEMP/qta-source.tgz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qta-source-snapshot
          path: ${{ runner.temp }}/qta-source.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
