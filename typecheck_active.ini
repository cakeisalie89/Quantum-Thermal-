# The current-active type-check configuration (tools/typecheck_scope.py).
#
# A file of its own, not more [tool.mypy] in pyproject.toml, because
# pyproject.toml is part of the byte-reproduction witness's environment lock
# (docs/byte_reproduction_profile.json): editing it -- even a comment --
# makes the witness profile stop applying to the tree. The base below
# restates pyproject.toml's staged settings, which `uv run mypy
# qta_multiphysics/stack` (stack-verify) still reads from there.

[mypy]
python_version = 3.12
warn_unused_ignores = True

[mypy-qta_multiphysics.stage7_boundary_models]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# The legacy numerical tree: followed for types, not reported on.
[mypy-qta_multiphysics.*]
follow_imports = silent

# The Stage-10 stack adapters, held to the Stage-7 standard.
[mypy-qta_multiphysics.stack.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_unreachable = True

# Third-party packages without type information, named one by one: there
# is no global --ignore-missing-imports.
[mypy-qutip.*,scipy.*,snakemake.*,h5py.*,SALib.*,openmdao.*,pxr.*,dolfinx.*,qta_kernels.*,basix.*,ufl.*,mpi4py.*,petsc4py.*,fmpy.*,numpy._core._multiarray_umath]
ignore_missing_imports = True

# FROZEN BY PROVENANCE, not exempt by preference. These three modules are the
# source closure whose digest identifies surface.langmuir_capture, and the
# NF-1T development dataset pins that digest: adding even an annotation
# changes the model's implementation identity and orphans the dataset's
# provenance. Their diagnostics were triaged one by one (inferred container
# types, narrowing mypy cannot follow, numpy's config TypedDict) and none is
# a runtime defect. Disabled by code, for these modules only;
# tests/test_typecheck_scope.py pins this list to the real closure.
[mypy-scientific.backend_probe,scientific.identity,scientific.models.surface_adsorption]
disable_error_code = arg-type, assignment, call-overload, type-var, typeddict-item, union-attr, var-annotated
