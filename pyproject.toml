# The Scientific AI Harness. Single tooling authority (dependencies, pytest,
# Ruff); uv.lock is the resolution authority. The active type-check
# configuration is its own file, typecheck_active.ini.
[project]
name = "scientific-ai-harness"
version = "0.8.0"
description = "Governed scientific-agent harness with event-sourced authority, replaceable numerical models and independent verification"
requires-python = "==3.12.*"
dependencies = [
  "numpy==2.4.4",   # the scientific models' array arithmetic
  "scipy==1.17.1",  # stiff integration and sparse solves (slab method-of-lines check)
  "h5py>=3.11",     # HDF5 representation of result bundles (no physics)
]

[project.optional-dependencies]
# Optional integrations. Each fails closed when its extra is absent: it
# reports availability = UNAVAILABLE and nothing is recorded as a pass.
# `uv sync --all-groups` deliberately does NOT pull these in; ask for them
# with `--extra <name>`.
viz = [
  "usd-core>=25.2",   # OpenUSD stage validation (.usda is written directly)
]
uq = [
  "SALib>=1.5",       # global (Sobol) sensitivity cross-check
  "openmdao>=3.35",   # design-space exploration over a scientific model
]
# The learned-model substrate (scientific_ai.neural, tranche NF-1T): reverse-
# mode autodiff for training, abstract evaluation (jax.eval_shape) for the
# zero-allocation validation of the ~1T architecture, and SPMD sharding for
# the distributed-software interfaces. Pinned exactly: a training run's
# numerics belong to its framework version, which every training manifest
# records. CPU wheels from PyPI; Apache-2.0. The parameter engine, solver,
# estimators and manifests import no JAX at all. ml-dtypes (Apache-2.0,
# already JAX's own dependency) is listed because the checkpoint codec
# imports it directly for bfloat16 (D-2026-74: a direct import is a declared
# dependency).
neural = [
  "jax==0.11.2",
  "jaxlib==0.11.2",
  "ml-dtypes==0.6.0",
]
# FEniCSx (dolfinx) is intentionally NOT listed: it is not installable as a
# plain wheel and comes from a hashed conda environment
# (integrations/fenicsx/), where integrations/fenicsx/runner.py runs out of
# process for scientific/checks/fenicsx_slab.py.

[dependency-groups]
dev = [
  "pytest>=8.3",      # unified test execution
  "hypothesis>=6.112", # bounded property tests (deterministic profile)
  "ruff>=0.6",        # lint enforcement
  "mypy>=1.11",       # type enforcement (typecheck_active.ini)
  "pydantic>=2.9",    # trusted-boundary validation models
  "pyyaml>=6.0",      # imported directly by the workflow-contract tests (D-2026-74)
]
workflow = [
  "snakemake>=8.20",  # dependency-aware orchestration of the governed workflow
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 79
extend-exclude = ["outputs", "verification"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"*.py" = []
