# QTA Stage-7 project foundation. Single tooling authority (dependencies,
# pytest, Ruff, mypy). Scientific pins mirror requirements.txt verbatim
# (the discovered Stage-6 authority); uv.lock is the resolution authority.
# MODEL-ONLY / FORECAST-ONLY project: this file changes no scientific
# behavior and no governance state.
[project]
name = "qta-multiphysics"
version = "0.7.0"
description = "Governed scientific-agent framework with event-sourced memory and replaceable numerical models"
requires-python = "==3.12.*"
dependencies = [
  "numpy==2.4.4",   # pre-existing QTA runtime dependency (requirements.txt)
  "scipy==1.17.1",  # pre-existing QTA runtime dependency (requirements.txt)
  "qutip==5.2.1",   # NV S=1 spin layer (requirements.txt; behavior-sensitive)
  "h5py>=3.11",     # Stage-8 HDF5 data layer (representation only; no physics)
]

[project.optional-dependencies]
# Stage-10 scientific-stack extras. These are OPTIONAL by policy: every
# adapter in `qta_multiphysics/stack/` fails closed when its extra is absent
# (reports availability = UNAVAILABLE and defers to the in-repo authority),
# so neither the container, the release workflow, nor the canonical outputs
# depend on anything listed here. `uv sync --all-groups` deliberately does
# NOT pull these in; ask for them with `--extra <name>`.
viz = [
  "usd-core>=25.2",   # OpenUSD stage validation (.usda is written directly)
]
uq = [
  "SALib>=1.5",       # global (Sobol/Morris) sensitivity cross-check
  "openmdao>=3.35",   # design-space exploration over the thermal ROM
]
# The learned-model substrate (scientific_ai.neural, tranche NF-1T): reverse-
# mode autodiff for training, abstract evaluation (jax.eval_shape) for the
# zero-allocation validation of the ~1T architecture, and SPMD sharding for
# the distributed-software interfaces. Pinned exactly: a training run's
# numerics belong to its framework version, which every training manifest
# records. CPU wheels from PyPI; Apache-2.0. An extra and not a dependency
# group ON PURPOSE: reference_backend/build.sh exports --all-groups, so a
# group would change the reference runtime; the canonical generator and the
# container install nothing listed here, and the release workflow installs it
# only so that its full test suite runs the learned-model tests instead of
# skipping them. The parameter engine, solver, estimators and manifests
# import no JAX at all. ml-dtypes (Apache-2.0, already JAX's own dependency)
# is listed because the checkpoint codec imports it directly for bfloat16
# (D-2026-74: a direct import is a declared dependency).
neural = [
  "jax==0.11.2",
  "jaxlib==0.11.2",
  "ml-dtypes==0.6.0",
]
# FEniCSx (dolfinx) is intentionally NOT listed: it is not installable as a
# plain wheel and must come from the environment (conda-forge, spack, or the
# dolfinx container). `qta_multiphysics.stack.fem_fenicsx` detects it at
# runtime and stays STAGED until an environment provides it.

[dependency-groups]
dev = [
  "pytest>=8.3",      # unified test execution (wraps existing suites)
  "hypothesis>=6.112", # bounded property tests (deterministic profile)
  "ruff>=0.6",        # staged lint enforcement
  "mypy>=1.11",       # staged type enforcement
  "pydantic>=2.9",    # trusted-boundary validation models
  "pyyaml>=6.0",      # imported directly by two workflow-contract trust tests (D-2026-74)
]
workflow = [
  "snakemake>=8.20",  # dependency-aware wrapper over authoritative commands
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q -p no:cacheprovider"
# NOTE (sandbox): the full 176-test set exceeds this environment's
# per-command wall ceiling in one invocation; CI should run `pytest tests/`
# whole; here it is executed in documented batches with identical scope.

[tool.ruff]
line-length = 79
extend-exclude = ["attic", "EXPERIMENT_PLAYBOOKS", "outputs"]

[tool.ruff.lint]
# conservative default set; stronger standard applies to Stage-7 modules
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# legacy scientific tree: catalogued, not rewritten (no behavior-risk edits)
"qta_multiphysics/**" = ["E501"]
"tests/**" = ["E501"]
"*.py" = []

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
# staged enforcement: strict-ish on Stage-7 modules; legacy numerical tree
# excluded from this stage (documented typing debt, not silenced errors)
[[tool.mypy.overrides]]
module = "qta_multiphysics.stage7_boundary_models"
disallow_untyped_defs = true
disallow_incomplete_defs = true
[[tool.mypy.overrides]]
# Legacy numerical tree: followed for types but not reported on. This is the
# same staged position as above — documented typing debt, not silenced errors:
# modules named explicitly on the command line are still fully checked.
module = "qta_multiphysics.*"
follow_imports = "silent"
[[tool.mypy.overrides]]
# Stage-10 stack adapters are new code and are held to the Stage-7 standard
module = "qta_multiphysics.stack.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unreachable = true
[[tool.mypy.overrides]]
module = ["qutip.*", "scipy.*", "snakemake.*", "h5py.*",
          "SALib.*", "openmdao.*", "pxr.*", "dolfinx.*", "qta_kernels.*"]
ignore_missing_imports = true   # third-party packages without type info
